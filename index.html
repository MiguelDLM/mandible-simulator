<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mandíbula 3D · Biomecánica paso a paso</title>
    <meta name="description" content="">
    <script>
        // Apply the saved/system theme before first paint
        try {
            const t = localStorage.getItem('jaw-theme');
            if (t) document.documentElement.dataset.theme = t;
        } catch (e) { /* storage unavailable */ }
    </script>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.css">
    <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.js"></script>
    <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/contrib/auto-render.min.js"></script>
    <script type="importmap">
    {
        "imports": {
            "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
            "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
        }
    }
    </script>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
<!-- All visible text lives in modules/locales/*.js and is injected through data-i18n attributes. -->
<div class="app">
    <!-- ============ Header ============ -->
    <header class="topbar">
        <div class="brand">
            <div class="brand-mark"><i class="fa-solid fa-bone"></i></div>
            <div>
                <h1 data-i18n="brand.title"></h1>
                <p data-i18n="brand.sub"></p>
            </div>
        </div>
        <nav class="scenarios" id="scenarios" data-i18n-attr="aria-label:scenarios.aria"></nav>
        <div class="top-actions">
            <div class="seg lang-switch" role="group" data-i18n-attr="aria-label:btn.lang.aria">
                <button data-lang="es" lang="es">ES</button>
                <button data-lang="en" lang="en">EN</button>
            </div>
            <button class="btn btn-ghost" id="btn-reset" data-i18n-attr="title:btn.reset.title"><i class="fa-solid fa-rotate-left"></i><span data-i18n="btn.reset"></span></button>
            <button class="btn btn-icon" id="btn-theme" data-i18n-attr="title:btn.theme.title;aria-label:btn.theme.title"><i class="fa-solid fa-circle-half-stroke"></i></button>
        </div>
    </header>

    <main class="workspace">
        <!-- ============ Controls ============ -->
        <aside class="panel controls" data-i18n-attr="aria-label:controls.aria">
            <div class="panel-scroll">
                <section class="ctl">
                    <h2><span class="ctl-num">1</span> <span data-i18n="ctl.bite"></span></h2>
                    <div id="arch-picker" class="arch-picker" data-i18n-attr="aria-label:arch.aria"></div>
                    <div class="field">
                        <div class="field-head">
                            <label for="bite-t" data-i18n="bite.pos"></label>
                            <output id="bite-t-out" class="pill"></output>
                        </div>
                        <input type="range" id="bite-t" min="-1" max="1" step="0.005" value="0">
                    </div>
                    <div class="field">
                        <label for="bite-dir" data-i18n="bite.dir"></label>
                        <select id="bite-dir">
                            <option value="vertical" data-i18n="bite.dir.vertical"></option>
                            <option value="occlusal" data-i18n="bite.dir.occlusal"></option>
                            <option value="free" data-i18n="bite.dir.free"></option>
                        </select>
                    </div>
                    <div id="bite-free" class="field-grid" hidden>
                        <div class="field">
                            <div class="field-head"><label for="bite-alpha" data-i18n="bite.alpha"></label><output id="bite-alpha-out" class="pill">0°</output></div>
                            <input type="range" id="bite-alpha" min="-35" max="35" step="1" value="0">
                        </div>
                        <div class="field">
                            <div class="field-head"><label for="bite-beta" data-i18n="bite.beta"></label><output id="bite-beta-out" class="pill">0°</output></div>
                            <input type="range" id="bite-beta" min="-35" max="35" step="1" value="0">
                        </div>
                        <p class="hint">\(\hat u_B \propto [\tan\beta,\ \tan\alpha,\ -1]\)</p>
                    </div>
                    <details class="adv">
                        <summary data-i18n="bite.manual"></summary>
                        <label class="check"><input type="checkbox" id="bite-custom"> <span data-i18n="bite.custom"></span></label>
                        <div class="xyz">
                            <label>x<sub>B</sub><input type="number" id="bite-x" step="1"></label>
                            <label>y<sub>B</sub><input type="number" id="bite-y" step="1"></label>
                            <label>z<sub>B</sub><input type="number" id="bite-z" step="1"></label>
                        </div>
                    </details>
                </section>

                <section class="ctl">
                    <h2><span class="ctl-num">2</span> <span data-i18n="ctl.gape"></span></h2>
                    <div class="field">
                        <div class="field-head"><label for="theta" data-i18n="gape.theta"></label><output id="theta-out" class="pill">0°</output></div>
                        <input type="range" id="theta" min="0" max="25" step="0.5" value="0">
                    </div>
                    <p class="hint" data-i18n="gape.hint"></p>
                </section>

                <section class="ctl">
                    <h2><span class="ctl-num">3</span> <span data-i18n="ctl.geom"></span></h2>
                    <div class="field">
                        <div class="field-head"><label for="geom-w" data-i18n="geom.w"></label><output id="geom-w-out" class="pill">100 mm</output></div>
                        <input type="range" id="geom-w" min="80" max="130" step="1" value="100">
                    </div>
                    <div class="field">
                        <div class="field-head"><label for="geom-L" data-i18n="geom.L"></label><output id="geom-L-out" class="pill">95 mm</output></div>
                        <input type="range" id="geom-L" min="70" max="120" step="1" value="95">
                    </div>
                    <p class="hint" data-i18n="geom.hint"></p>
                </section>

                <section class="ctl">
                    <h2><span class="ctl-num">4</span> <span data-i18n="ctl.muscles"></span></h2>
                    <div id="muscle-list" class="muscle-list"></div>
                </section>
            </div>
        </aside>

        <!-- ============ 3D viewer ============ -->
        <section class="panel viewer-panel" data-i18n-attr="aria-label:viewer.aria">
            <div class="viewer-toolbar">
                <div class="seg" role="group" data-i18n-attr="aria-label:view.aria">
                    <button data-view="iso" class="active" data-i18n="view.iso"></button>
                    <button data-view="front" data-i18n="view.front"></button>
                    <button data-view="side" data-i18n="view.side"></button>
                    <button data-view="top" data-i18n="view.top"></button>
                </div>
                <div class="toolbar-group">
                    <button class="toggle on" data-opt="labels" data-i18n-attr="title:opt.labels;aria-label:opt.labels"><i class="fa-solid fa-tag"></i></button>
                    <button class="toggle on" data-opt="bodies" data-i18n-attr="title:opt.bodies;aria-label:opt.bodies"><i class="fa-solid fa-grip-lines"></i></button>
                    <button class="toggle on" data-opt="triangle" data-i18n-attr="title:opt.triangle;aria-label:opt.triangle"><i class="fa-solid fa-play fa-rotate-270"></i></button>
                    <button class="toggle on" data-opt="axes" data-i18n-attr="title:opt.axes;aria-label:opt.axes"><i class="fa-solid fa-arrows-up-down-left-right"></i></button>
                    <label class="scale-ctl" data-i18n-attr="title:opt.scale">
                        <i class="fa-solid fa-up-right-and-down-left-from-center"></i>
                        <input type="range" id="vec-scale" min="0.05" max="0.4" step="0.01" value="0.2" data-i18n-attr="aria-label:opt.scale">
                    </label>
                    <button class="btn btn-primary btn-sm" id="btn-play"></button>
                </div>
            </div>
            <div class="viewer" id="viewer">
                <div class="hud" id="hud"></div>
                <div class="legend">
                    <span><i class="sw sw-muscle"></i><span data-i18n="legend.muscle"></span></span>
                    <span><i class="sw sw-bite"></i><span data-i18n="legend.bite"></span></span>
                    <span><i class="sw sw-jl"></i><span data-i18n="legend.jl"></span></span>
                    <span><i class="sw sw-jr"></i><span data-i18n="legend.jr"></span></span>
                    <span><i class="sw sw-m"></i><span data-i18n="legend.m"></span></span>
                </div>
                <div class="viewer-help" data-i18n="viewer.help"></div>
            </div>
        </section>

        <!-- ============ Analysis ============ -->
        <section class="panel analysis" data-i18n-attr="aria-label:analysis.aria">
            <div class="tabs" role="tablist">
                <button role="tab" class="tab active" data-tab="results" aria-selected="true" data-i18n="tab.results"></button>
                <button role="tab" class="tab" data-tab="steps" aria-selected="false" data-i18n="tab.steps"></button>
                <button role="tab" class="tab" data-tab="concepts" aria-selected="false" data-i18n="tab.concepts"></button>
            </div>

            <!-- Results -->
            <div class="tab-panel active" id="tab-results" role="tabpanel">
                <div class="kpis">
                    <div class="kpi kpi-bite">
                        <span class="kpi-label" data-i18n="kpi.fb"></span>
                        <span class="kpi-value" id="kpi-fb">–</span>
                        <span class="kpi-sub" id="kpi-fb-sub"></span>
                    </div>
                    <div class="kpi kpi-ma">
                        <span class="kpi-label" data-i18n="kpi.ma"></span>
                        <span class="kpi-value" id="kpi-ma">–</span>
                        <span class="kpi-sub" id="kpi-ma-sub"></span>
                    </div>
                    <div class="kpi kpi-jl">
                        <span class="kpi-label" data-i18n="kpi.jl"></span>
                        <span class="kpi-value" id="kpi-jl">–</span>
                        <span class="kpi-sub" id="kpi-jl-sub"></span>
                    </div>
                    <div class="kpi kpi-jr">
                        <span class="kpi-label" data-i18n="kpi.jr"></span>
                        <span class="kpi-value" id="kpi-jr">–</span>
                        <span class="kpi-sub" id="kpi-jr-sub"></span>
                    </div>
                </div>
                <div id="alerts" class="alerts"></div>

                <article class="card">
                    <header class="card-head">
                        <h3 data-i18n="card.sweep"></h3>
                        <div class="chart-legend" data-i18n="card.sweep.legend"></div>
                    </header>
                    <div id="sweep-chart"></div>
                    <p class="caption" data-i18n="card.sweep.caption"></p>
                </article>

                <article class="card">
                    <header class="card-head"><h3 data-i18n="card.contrib"></h3></header>
                    <div id="contrib"></div>
                    <p class="caption" data-i18n="card.contrib.caption"></p>
                </article>

                <article class="card">
                    <header class="card-head"><h3 data-i18n="card.tri"></h3></header>
                    <div id="tri-chart-results"></div>
                    <p class="caption" data-i18n="card.tri.caption"></p>
                </article>
            </div>

            <!-- Steps -->
            <div class="tab-panel" id="tab-steps" role="tabpanel">
                <div class="steps-toolbar">
                    <span data-i18n="steps.muscle"></span>
                    <div id="muscle-chips" class="chips"></div>
                </div>
                <nav class="step-index" id="step-index" data-i18n-attr="aria-label:steps.index"></nav>

                <article class="step" id="step-0" data-focus="jaw,bite,joints,hinge">
                    <div class="step-num">0</div>
                    <h3 data-i18n="step.0.title"></h3>
                    <div data-i18n="step.0.body"></div>
                    <p class="data-label" data-i18n="steps.data"></p>
                    <div class="math" id="s0-data"></div>
                    <div class="subnote" id="s0-rotation" hidden><p class="rot-text"></p><div class="math rot-math"></div></div>
                </article>

                <p class="empty-note" id="steps-empty" hidden data-i18n="steps.empty"></p>

                <article class="step needs-muscle" id="step-1" data-focus="muscle">
                    <div class="step-num">1</div>
                    <h3 data-i18n="step.1.title"></h3>
                    <div data-i18n="step.1.body"></div>
                    <div class="math" id="s1-detail"></div>
                    <details class="all"><summary data-i18n="steps.all"></summary><div id="s1-table"></div></details>
                </article>

                <article class="step needs-muscle" id="step-2" data-focus="muscles">
                    <div class="step-num">2</div>
                    <h3 data-i18n="step.2.title"></h3>
                    <div data-i18n="step.2.body"></div>
                    <div class="math" id="s2-detail"></div>
                    <details class="all"><summary data-i18n="steps.allR"></summary><div id="s2-table"></div></details>
                </article>

                <article class="step needs-muscle" id="step-3" data-focus="lever">
                    <div class="step-num">3</div>
                    <h3 data-i18n="step.3.title"></h3>
                    <div data-i18n="step.3.body"></div>
                    <div class="math" id="s3-detail"></div>
                    <details class="all" open><summary data-i18n="steps.allTau"></summary><div id="s3-table"></div></details>
                    <p class="hint" data-i18n="step.3.hint"></p>
                </article>

                <article class="step needs-muscle" id="step-4" data-focus="lever,bite">
                    <div class="step-num">4</div>
                    <h3 data-i18n="step.4.title"></h3>
                    <div data-i18n="step.4.body"></div>
                    <div class="math" id="s4-math"></div>
                    <div id="s4-lever"></div>
                </article>

                <article class="step needs-muscle" id="step-5" data-focus="bite">
                    <div class="step-num">5</div>
                    <h3 data-i18n="step.5.title"></h3>
                    <div data-i18n="step.5.body"></div>
                    <div class="math" id="s5-math"></div>
                </article>

                <article class="step needs-muscle" id="step-6" data-focus="joints">
                    <div class="step-num">6</div>
                    <h3 data-i18n="step.6.title"></h3>
                    <div data-i18n="step.6.body"></div>
                    <div class="math" id="s6-math"></div>
                </article>

                <article class="step needs-muscle" id="step-7" data-focus="joints">
                    <div class="step-num">7</div>
                    <h3 data-i18n="step.7.title"></h3>
                    <div data-i18n="step.7.body"></div>
                    <div class="math" id="s7-math"></div>
                    <div id="s7-interp"></div>
                </article>

                <article class="step needs-muscle" id="step-8" data-focus="muscles,bite,joints">
                    <div class="step-num">8</div>
                    <h3 data-i18n="step.8.title"></h3>
                    <div data-i18n="step.8.body"></div>
                    <div class="math" id="s8-math"></div>
                </article>

                <article class="step needs-muscle" id="step-9" data-focus="triangle,bite,joints">
                    <div class="step-num">9</div>
                    <h3 data-i18n="step.9.title"></h3>
                    <div data-i18n="step.9.body"></div>
                    <div class="math" id="s9-math"></div>
                    <p class="hint" id="s9-note" hidden data-i18n="step.9.note"></p>
                    <div id="tri-chart-steps"></div>
                    <div data-i18n="step.9.after"></div>
                </article>
            </div>

            <!-- Concepts -->
            <div class="tab-panel" id="tab-concepts" role="tabpanel">
                <article class="concept intro"><h4 data-i18n="c.howto.title"></h4><div data-i18n="c.howto.body"></div></article>
                <article class="concept" id="term-vector"><h4 data-i18n="c.vector.title"></h4><div data-i18n="c.vector.body"></div></article>
                <article class="concept" id="term-unit"><h4 data-i18n="c.unit.title"></h4><div data-i18n="c.unit.body"></div></article>
                <article class="concept" id="term-scalar"><h4 data-i18n="c.scalar.title"></h4><div data-i18n="c.scalar.body"></div></article>
                <article class="concept" id="term-torque"><h4 data-i18n="c.torque.title"></h4><div data-i18n="c.torque.body"></div></article>
                <article class="concept" id="term-cross"><h4 data-i18n="c.cross.title"></h4><div data-i18n="c.cross.body"></div></article>
                <article class="concept" id="term-lever"><h4 data-i18n="c.lever.title"></h4><div data-i18n="c.lever.body"></div></article>
                <article class="concept" id="term-rigid"><h4 data-i18n="c.rigid.title"></h4><div data-i18n="c.rigid.body"></div></article>
                <article class="concept" id="term-static"><h4 data-i18n="c.static.title"></h4><div data-i18n="c.static.body"></div></article>
                <article class="concept" id="term-indeterminate"><h4 data-i18n="c.indet.title"></h4><div data-i18n="c.indet.body"></div></article>
                <article class="concept" id="term-ma"><h4 data-i18n="c.ma.title"></h4><div data-i18n="c.ma.body"></div></article>
                <article class="concept" id="term-greaves"><h4 data-i18n="c.greaves.title"></h4><div data-i18n="c.greaves.body"></div></article>
                <article class="concept" id="term-distraction"><h4 data-i18n="c.distraction.title"></h4><div data-i18n="c.distraction.body"></div></article>
                <article class="concept warn" id="term-limits"><h4 data-i18n="c.limits.title"></h4><div data-i18n="c.limits.body"></div></article>
            </div>
        </section>
    </main>
</div>

<script type="module" src="app.js"></script>
</body>
</html>
